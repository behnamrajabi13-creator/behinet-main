name: Build Android APK
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'
          accept-android-sdk-licenses: true
      - name: Install Dependencies
        run: npm install --legacy-peer-deps
      - name: Patch
        run: |
          sed -i 's/const watchedDirectories = JSON.parse(watchedDirectoriesSerialized);/const watchedDirectories = []; \/\/ PATCHED/' node_modules/expo-modules-autolinking/build/commands/mirrorKotlinInlineModulesCommand.js || true
          sed -i 's/package="[^"]*"//g' node_modules/@react-native-masked-view/masked-view/android/src/main/AndroidManifest.xml || true
      - name: Fix gradle.properties BEFORE prebuild
        run: |
          mkdir -p android
          cat > android/gradle.properties << 'ENDOFFILE'
          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g
          org.gradle.daemon=false
          org.gradle.parallel=false
          android.useAndroidX=true
          android.enableJetifier=true
          ENDOFFILE
      - name: Prebuild
        run: npx expo prebuild --platform android --clean
      - name: Disable R8
        run: sed -i 's/minifyEnabled true/minifyEnabled false/g' android/app/build.gradle || true
      - name: Build APK
        run: |
          cd android
          ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: behinet-main-apk
          path: android/app/build/outputs/apk/release/app-release.apk
